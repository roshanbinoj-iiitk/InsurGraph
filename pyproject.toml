[project]
name = "insurgraph"
version = "0.1.0"
description = "LLM extraction, knowledge graph, RAG and evaluation over synthetic commercial P&C insurance documents"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
